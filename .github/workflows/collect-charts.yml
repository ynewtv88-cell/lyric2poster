name: Daily Chart Collector

on:
  schedule:
    - cron: "17 19 * * *"  # UTC 기준 매일 19:17 (한국 시간 새벽 4:17)[cite: 19, 40]
  workflow_dispatch:        # 사람이 직접 버튼을 눌러서 실행할 수 있는 기능

jobs:
  collect:
    runs-on: ubuntu-latest  # 깃허브가 빌려주는 무료 가상 컴퓨터(Linux)에서 실행[cite: 32, 36]
    permissions:
      contents: write       # 수집한 데이터를 다시 저장소에 커밋(저장)할 수 있는 권한[cite: 42, 43]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # 내 저장소 코드를 가상 컴퓨터로 가져오기[cite: 36, 38]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas  # 필요한 파이썬 부품 설치

      - name: Run collector script
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}  # 비밀 금고에서 API 키 꺼내 쓰기
        run: python scripts/collect_charts.py            # 차트 수집 프로그램 실행
